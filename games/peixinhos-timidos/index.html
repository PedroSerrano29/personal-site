<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2689bf">
<title>Peixinhos Tímidos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{
  --agua:#3a9fd0;
  --areia:#a38c63;
  --fundo:#0f4c7a;
  --texto:#f4fbff;
  --texto-suave:rgba(244,251,255,.86);
  --sombra:rgba(4,24,48,.42);
  --borda:rgba(255,255,255,.6);
  --acento:#ffc15e;
  --veu-1:rgba(8,44,78,.10);
  --veu-2:rgba(5,28,52,.62);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --agua:#2f8cbd; --areia:#8a7654; --fundo:#0b3d66;
    --texto:#eef8ff; --texto-suave:rgba(238,248,255,.82);
    --sombra:rgba(0,12,28,.5); --borda:rgba(255,255,255,.5);
    --acento:#ffc15e; --veu-1:rgba(4,30,56,.18); --veu-2:rgba(2,18,36,.7);
  }
}
:root[data-theme="dark"]{
  --agua:#2f8cbd; --areia:#8a7654; --fundo:#0b3d66;
  --texto:#eef8ff; --texto-suave:rgba(238,248,255,.82);
  --sombra:rgba(0,12,28,.5); --borda:rgba(255,255,255,.5);
  --acento:#ffc15e; --veu-1:rgba(4,30,56,.18); --veu-2:rgba(2,18,36,.7);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);
  background:linear-gradient(to bottom,var(--agua) 0 50%,var(--areia) 50% 100%)}
body{height:100%;margin:0;overflow:hidden;background:var(--fundo);color:var(--texto);
  font-family:"Baloo 2",ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Segoe UI",system-ui,sans-serif;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#mar{display:block;width:100%;height:100%;max-width:100%;touch-action:none}
.inicio{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(10px,2.2vh,20px);text-align:center;cursor:pointer;
  padding:calc(env(safe-area-inset-top,0px) + 20px) 22px calc(env(safe-area-inset-bottom,0px) + 20px);
  background:radial-gradient(120% 90% at 50% 40%,var(--veu-1),var(--veu-2));
  transition:opacity .9s ease,visibility 0s linear .9s}
.inicio.fora{opacity:0;visibility:hidden;pointer-events:none}
.inicio h1{margin:0;font-weight:800;font-size:clamp(38px,9.5vw,70px);line-height:.95;letter-spacing:.01em;
  text-shadow:0 3px 0 var(--sombra),0 12px 34px var(--sombra)}
.botao{appearance:none;-webkit-appearance:none;border:0;margin:0;padding:0;color:inherit;cursor:pointer;
  width:clamp(118px,32vw,172px);aspect-ratio:1/1;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.62),rgba(255,255,255,.16) 42%,rgba(255,255,255,.07) 70%,rgba(255,255,255,.14));
  box-shadow:inset 0 0 0 2px var(--borda),inset -10px -14px 26px rgba(10,70,130,.35),0 16px 44px var(--sombra);
  animation:boiar 3.4s ease-in-out infinite}
.botao:focus-visible{outline:3px solid var(--acento);outline-offset:6px}
.botao svg{width:62%;height:auto;overflow:visible;filter:drop-shadow(0 5px 6px rgba(4,24,48,.35))}
.rotulo{font-weight:700;font-size:clamp(19px,4.8vw,24px);line-height:1.2}
.nota{margin:0;max-width:33ch;font-weight:500;font-size:clamp(14px,3.6vw,17px);line-height:1.4;color:var(--texto-suave)}
.musica{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:0 12px;max-width:36ch;
  font-size:clamp(13px,3.4vw,15px);line-height:1.35;color:var(--texto-suave);cursor:default}
.musica b{font-weight:700;color:var(--texto);overflow-wrap:anywhere}
.ligacao{appearance:none;-webkit-appearance:none;border:0;background:none;margin:0;padding:10px 4px;font:inherit;
  font-weight:700;color:var(--acento);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.ligacao:focus-visible{outline:2px solid var(--acento);outline-offset:2px;border-radius:6px}
.dica{margin:0;max-width:36ch;font-size:clamp(12px,3.1vw,14px);line-height:1.35;color:var(--texto-suave);opacity:.85}
.aviso{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:3;
  width:max-content;max-width:min(92vw,420px);padding:10px 16px;border-radius:16px;background:rgba(5,28,52,.8);
  color:#f4fbff;font-size:15px;line-height:1.35;text-align:center;opacity:0;transition:opacity .4s ease;pointer-events:none}
.aviso.ver{opacity:1}
.acordado{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;pointer-events:none}
@keyframes boiar{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.botao{animation:none}}
@media (max-height:520px){
  .inicio{gap:6px}
  .inicio h1{font-size:30px}
  .botao{width:88px}
  .nota{display:none}
}
</style>
</head>
<body>
<canvas id="mar" aria-label="Fundo do mar com peixinhos"></canvas>

<div class="inicio" id="inicio">
  <h1>Peixinhos<br>Tímidos</h1>
  <button class="botao" id="botao" type="button" aria-label="Começar">
    <svg viewBox="0 0 120 90" aria-hidden="true">
      <path d="M30 45 Q14 28 5 20 Q12 45 5 70 Q14 62 30 45Z" fill="#ff8f3d"/>
      <path d="M46 18 Q62 3 80 16 Z" fill="#ff8f3d"/>
      <ellipse cx="64" cy="45" rx="40" ry="31" fill="#ffa94f"/>
      <ellipse cx="62" cy="58" rx="30" ry="15" fill="#fff1d8" opacity=".75"/>
      <ellipse cx="58" cy="29" rx="22" ry="7" fill="#fff" opacity=".28"/>
      <circle cx="82" cy="39" r="11" fill="#fff"/>
      <circle cx="84.5" cy="40" r="6.8" fill="#1d2440"/>
      <circle cx="82" cy="36.5" r="2.6" fill="#fff"/>
      <ellipse cx="76" cy="54" rx="6" ry="4" fill="#ff7a93" opacity=".45"/>
      <path d="M93 51 q4.5 4.5 9 0" fill="none" stroke="#3a2440" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </button>
  <div class="rotulo">Toca para começar</div>
  <p class="nota">Toca no ecrã ou mexe o rato: os peixinhos fogem e a música para. Com um bocadinho de calma, voltam um a um e a música recomeça devagarinho, onde tinha ficado.</p>
  <div class="musica" id="caixaMusica">
    <span>Música: <b id="nomeMusica">canção de embalar do jogo</b></span>
    <button type="button" class="ligacao" id="escolher">Escolher um ficheiro de música</button>
    <button type="button" class="ligacao" id="usarJogo" hidden>Usar a canção do jogo</button>
    <input type="file" id="ficheiro" accept="audio/*" hidden>
  </div>
  <p class="dica">Sem som? Tira o telemóvel do modo silencioso e sobe o volume.</p>
</div>
<div class="aviso" id="aviso" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ===== Ajustes fáceis de mudar ===== */
const AJUSTES = {
  esperaAntesDeVoltar: 1.5,      // segundos sem toques até começarem a voltar
  intervaloEntreRegressos: 2.0,  // segundos entre cada bicho que volta
  andamento: 64,                 // batidas por minuto da canção de embalar
  volumeMar: 0.2,                // som da água de fundo (0 a 1)
  volumeGeral: 1.7               // volume final (sobe se ainda estiver baixo)
};

const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const escolher = arr => arr[Math.floor(Math.random() * arr.length)];
const agoraSeg = () => performance.now() / 1000;
const normAng = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const coresCache = {};
function rgba(hex, a) {
  let c = coresCache[hex];
  if (!c) { const n = parseInt(hex.slice(1), 16); c = coresCache[hex] = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + clamp(a, 0, 1).toFixed(3) + ')';
}
function semErro(p) { if (p && typeof p.catch === 'function') p.catch(() => {}); }
const EH_IOS = (() => {
  try { return /iP(hone|ad|od)/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  catch (e) { return false; }
})();

/* ================= SOM ================= */
const Som = (() => {
  let ctx = null, master, musica, filtro, retorno, reverb, sfx, filtroAcordes, ruido, desbloqueio = null;
  let ganhoFaixa = null, analisador = null, amostras = null;
  const camadas = [], alvo = [];
  // camadas, pela ordem em que voltam: 0 melodia · 1 harpa · 2 baixo · 3 acordes · 4 flauta · 5 sininhos
  const VOL = [1, 0.85, 0.9, 0.8, 0.75, 0.6];
  const VOL_GERAL = [0.7, 0.72, 0.8, 0.86, 0.92, 0.96, 1];  // a música ganha corpo à medida que voltam mais bichos
  const VOL_FAIXA = [0, 0.4, 0.55, 0.68, 0.8, 0.9, 1];
  const TEMPO = 60 / AJUSTES.andamento, COMPASSO = TEMPO * 3;
  let eventos = [], notas = [], inicios = [];
  let proximo = 0, nCompasso = 0, pausado = true, retomaEm = 0, abafado = false, ativas = 0;
  let modo = 'cancao', faixa = null, fonteFaixa = null, posFaixa = 0, zeroFaixa = 0, aTocar = false;
  let aoFalhar = null;

  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const vozes = (pcs, lo) => pcs.map(pc => lo + (((pc - lo) % 12) + 12) % 12).sort((a, b) => a - b);

  const ACORDES = { C: [0, 4, 7], Am: [9, 0, 4], F: [5, 9, 0], G: [7, 11, 2], Dm: [2, 5, 9] };
  // Canção de embalar original em 3/4: [acorde, melodia [[nota MIDI, tempos]], contracanto]
  const A1 = [
    ['C',  [[79, 2], [76, 1]],          76],
    ['Am', [[81, 1], [84, 1], [81, 1]], 72],
    ['F',  [[81, 2], [77, 1]],          72],
    ['G',  [[79, 3]],                   71],
    ['C',  [[79, 2], [76, 1]],          72],
    ['Am', [[76, 1], [81, 1], [84, 1]], 76],
    ['Dm', [[86, 2], [84, 1]],          77],
    ['G',  [[83, 2], [79, 1]],          74]
  ];
  const A2 = [
    ['C',  [[79, 2], [76, 1]],          76],
    ['Am', [[81, 1], [84, 1], [81, 1]], 72],
    ['F',  [[81, 2], [77, 1]],          72],
    ['G',  [[79, 3]],                   71],
    ['C',  [[76, 1], [79, 1], [84, 1]], 79],
    ['Am', [[84, 2], [81, 1]],          76],
    ['G',  [[79, 1], [77, 1], [74, 1]], 74],
    ['C',  [[72, 3]],                   72]
  ];
  const B = [
    ['F',  [[81, 2], [84, 1]],          72],
    ['C',  [[79, 2], [76, 1]],          76],
    ['Dm', [[77, 1], [81, 1], [86, 1]], 77],
    ['Am', [[84, 3]],                   76],
    ['F',  [[81, 1], [79, 1], [77, 1]], 77],
    ['C',  [[76, 2], [79, 1]],          79],
    ['Dm', [[77, 2], [74, 1]],          77],
    ['G',  [[74, 1], [77, 1], [83, 1]], 74]
  ];
  const CANCAO = A1.concat(A2, B, A2);

  function ganho(destino, v) { const n = ctx.createGain(); n.gain.value = v; n.connect(destino); return n; }
  // cada nota fica registada para poder ser cancelada quando a música para
  function nota(destino, t) { const n = ganho(destino, 0); notas.push({ n, t }); return n; }
  function osc(tipo, f, t, fim, destino, detune) {
    const o = ctx.createOscillator();
    o.type = tipo;
    o.frequency.setValueAtTime(f, t);
    if (detune) o.detune.setValueAtTime(detune, t);
    o.connect(destino);
    o.start(t);
    o.stop(fim);
    return o;
  }
  function pica(n, t, pico, tau, ataque) {
    n.gain.setValueAtTime(0.0001, t);
    n.gain.linearRampToValueAtTime(pico, t + ataque);
    n.gain.setTargetAtTime(0.0001, t + ataque, tau);
  }

  /* --- instrumentos --- */
  function caixinha(m, t, dur) {                 // 0 · melodia em caixinha de música
    const f = hz(m);
    const a = nota(camadas[0], t); pica(a, t, 0.32, Math.min(0.95, 0.42 + dur * 0.15), 0.004); osc('sine', f, t, t + 4.2, a);
    const b = nota(camadas[0], t); pica(b, t, 0.08, 0.35, 0.003); osc('sine', f * 2, t, t + 1.8, b);
    const c = nota(camadas[0], t); pica(c, t, 0.05, 0.08, 0.002); osc('sine', f * 4.02, t, t + 0.6, c);
  }
  function harpa(m, t, vel) {                    // 1 · harpa
    const n = nota(camadas[1], t);
    pica(n, t, 0.2 * vel, 0.5, 0.006);
    const f = hz(m);
    osc('triangle', f, t, t + 3, n);
    osc('sine', f * 2, t, t + 1.5, ganho(n, 0.25));
  }
  function baixo(m, t, dur, vel) {               // 2 · baixo
    const n = nota(camadas[2], t);
    pica(n, t, 0.34 * vel, dur * 0.45, 0.02);
    const f = hz(m);
    osc('sine', f, t, t + dur + 1.6, n);
    osc('triangle', f * 2, t, t + dur + 1.6, ganho(n, 0.5));
    osc('sine', f * 3, t, t + dur + 1.2, ganho(n, 0.18));
  }
  function acordes(lista, t, dur) {              // 3 · acordes suaves
    for (const m of lista) {
      const n = nota(filtroAcordes, t);
      n.gain.setValueAtTime(0, t);
      n.gain.linearRampToValueAtTime(0.07, t + 0.9);
      n.gain.setValueAtTime(0.07, t + dur);
      n.gain.linearRampToValueAtTime(0, t + dur + 1.3);
      const f = hz(m);
      osc('triangle', f, t, t + dur + 1.4, n, -6);
      osc('sine', f, t, t + dur + 1.4, n, 6);
    }
  }
  function flauta(m, t, dur) {                   // 4 · flauta
    const f = hz(m);
    const n = nota(camadas[4], t);
    n.gain.setValueAtTime(0, t);
    n.gain.linearRampToValueAtTime(0.12, t + 0.5);
    n.gain.setValueAtTime(0.12, t + dur - 0.15);
    n.gain.linearRampToValueAtTime(0, t + dur + 0.55);
    const o1 = osc('sine', f, t, t + dur + 0.6, n);
    const o2 = osc('triangle', f, t, t + dur + 0.6, ganho(n, 0.28));
    const lfo = ctx.createOscillator();
    lfo.frequency.value = 4.6;
    const prof = ctx.createGain();
    prof.gain.setValueAtTime(0, t);
    prof.gain.linearRampToValueAtTime(f * 0.006, t + 0.9);
    lfo.connect(prof); prof.connect(o1.frequency); prof.connect(o2.frequency);
    lfo.start(t); lfo.stop(t + dur + 0.6);
  }
  function sino(m, t, vel) {                     // 5 · sininhos
    const f = hz(m);
    for (const [mult, pico, tau] of [[1, 0.09, 1.3], [2.76, 0.03, 0.42], [5.4, 0.014, 0.14]]) {
      const n = nota(camadas[5], t);
      pica(n, t, pico * vel, tau, 0.003);
      osc('sine', f * mult, t, t + tau * 7, n);
    }
  }

  /* --- sequenciador --- */
  function evento(t, c, s) { eventos.push({ t, c, s }); }
  function agendarCompasso(i, t0) {
    const [nome, melodia, contra] = CANCAO[i % CANCAO.length];
    const pcs = ACORDES[nome];
    inicios.push({ i, t: t0 });
    if (inicios.length > 6) inicios.shift();
    let tm = t0;
    for (const [m, d] of melodia) { caixinha(m, tm, d * TEMPO); evento(tm, 0, 1); tm += d * TEMPO; }
    const [n0, n1, n2] = vozes(pcs, 60);
    [n0, n1, n2, n0 + 12, n2, n1].forEach((m, k) => {
      const tk = t0 + k * TEMPO / 2;
      harpa(m, tk, k ? 0.8 : 1);
      evento(tk, 1, k ? 0.5 : 0.85);
    });
    const raiz = vozes([pcs[0]], 45)[0], quinta = raiz + 7 <= 60 ? raiz + 7 : raiz - 5;
    baixo(raiz, t0, TEMPO * 2, 1); evento(t0, 2, 1);
    baixo(quinta, t0 + TEMPO * 2, TEMPO, 0.6); evento(t0 + TEMPO * 2, 2, 0.55);
    acordes(vozes(pcs, 55), t0, COMPASSO + 0.3); evento(t0, 3, 1);
    flauta(contra, t0, COMPASSO); evento(t0, 4, 0.9);
    const altos = vozes(pcs, 84);
    sino(altos[i % 3], t0, 1); evento(t0, 5, 1);
    if (i % 2) { const tb = t0 + TEMPO * 1.5; sino(altos[(i + 1) % 3], tb, 0.7); evento(tb, 5, 0.7); }
    eventos.sort((a, b) => a.t - b.t);
  }
  function agendar() {
    if (!ctx || ctx.state !== 'running' || pausado || modo !== 'cancao') return;
    const agora = ctx.currentTime;
    if (proximo < agora) proximo = agora + 0.1;
    while (proximo < agora + 1.2) { agendarCompasso(nCompasso, proximo); proximo += COMPASSO; nCompasso++; }
    if (notas.length > 400) notas = notas.filter(x => x.t > agora - 6);
  }

  /* --- água, eco e desbloqueio do iPhone --- */
  function ruidoRosa(seg) {
    const sr = ctx.sampleRate, L = Math.floor(sr * seg), N = Math.floor(sr * 0.5);
    const buf = ctx.createBuffer(2, L, sr);
    for (let ch = 0; ch < 2; ch++) {
      const bruto = new Float32Array(L + N);
      let b0 = 0, b1 = 0, b2 = 0;
      for (let i = 0; i < L + N; i++) {
        const w = Math.random() * 2 - 1;
        b0 = 0.99765 * b0 + w * 0.099046;
        b1 = 0.963 * b1 + w * 0.2965164;
        b2 = 0.57 * b2 + w * 1.0526913;
        bruto[i] = (b0 + b1 + b2 + w * 0.1848) * 0.2;
      }
      const d = buf.getChannelData(ch);
      for (let i = 0; i < L; i++) {
        if (i < N) { const k = i / N; d[i] = bruto[i] * Math.sqrt(k) + bruto[L + i] * Math.sqrt(1 - k); }
        else d[i] = bruto[i];
      }
    }
    return buf;
  }
  function ruidoBranco(seg) {
    const sr = ctx.sampleRate, L = Math.floor(sr * seg), buf = ctx.createBuffer(1, L, sr), d = buf.getChannelData(0);
    for (let i = 0; i < L; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }
  function impulso(seg) {
    const sr = ctx.sampleRate, L = Math.floor(sr * seg), buf = ctx.createBuffer(2, L, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let v = 0;
      for (let i = 0; i < L; i++) { v = v * 0.6 + (Math.random() * 2 - 1) * 0.4; d[i] = v * Math.pow(1 - i / L, 3); }
    }
    return buf;
  }
  function iniciarMar() {
    const fonte = ctx.createBufferSource();
    fonte.buffer = ruidoRosa(8);
    fonte.loop = true;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 140;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1000; lp.Q.value = 0.2;
    const vol = ctx.createGain(); vol.gain.value = 0;
    fonte.connect(hp); hp.connect(lp); lp.connect(vol); vol.connect(master);
    const l1 = ctx.createOscillator(); l1.frequency.value = 0.07;
    const p1 = ctx.createGain(); p1.gain.value = 450; l1.connect(p1); p1.connect(lp.frequency);
    const l2 = ctx.createOscillator(); l2.frequency.value = 0.11;
    const p2 = ctx.createGain(); p2.gain.value = AJUSTES.volumeMar * 0.35; l2.connect(p2); p2.connect(vol.gain);
    const t = ctx.currentTime;
    fonte.start(t); l1.start(t); l2.start(t);
    vol.gain.setTargetAtTime(AJUSTES.volumeMar, t, 1);
  }
  // Um ficheiro de silêncio a tocar em ciclo faz o iPhone tratar a página como "reprodução de música",
  // o que evita que o modo silencioso corte o som.
  function wavSilencioso() {
    const sr = 8000, n = 4000, buf = new Uint8Array(44 + n), dv = new DataView(buf.buffer);
    const txt = (o, s) => { for (let i = 0; i < s.length; i++) buf[o + i] = s.charCodeAt(i); };
    txt(0, 'RIFF'); dv.setUint32(4, 36 + n, true); txt(8, 'WAVE'); txt(12, 'fmt ');

/* ===== memória da música escolhida (fica neste navegador) ===== */
const BD = (() => {
  let p = null;
  function abrir() {
    if (!p) p = new Promise((res, rej) => {
      try {
        const r = window.indexedDB.open('peixinhos-timidos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('musica');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
    return p;
  }
  function pedido(tipo, fn) {
    return abrir().then(db => new Promise((res, rej) => {
      const tx = db.transaction('musica', tipo);
      const q = fn(tx.objectStore('musica'));
      tx.oncomplete = () => res(q ? q.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error);
    }));
  }
  return {
    ler: () => pedido('readonly', s => s.get('atual')),
    guardar: v => pedido('readwrite', s => s.put(v, 'atual')),
    apagar: () => pedido('readwrite', s => s.delete('atual'))
  };
})();

/* --- escolher música --- */
function mostrarMusica() {
  nomeMusica.textContent = musicaDados ? musicaNome : 'canção de embalar do jogo';
  escolherBtn.textContent = musicaDados ? 'Trocar' : 'Escolher um ficheiro de música';
  usarJogoBtn.hidden = !musicaDados;
}
function lerFicheiro(f) {
  if (typeof f.arrayBuffer === 'function') return f.arrayBuffer();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(f); });
}
escolherBtn.addEventListener('click', e => { e.stopPropagation(); inputFicheiro.click(); });

  e.stopPropagation();

  mostrarMusica();
  BD.apagar().catch(() => {});
});
inputFicheiro.addEventListener('click', e => e.stopPropagation());
inputFicheiro.addEventListener('change', () => {
  const f = inputFicheiro.files && inputFicheiro.files[0];
  inputFicheiro.value = '';
  if (!f) return;
  if (f.size > 40 * 1024 * 1024) { avisar('Esse ficheiro é grande demais. Escolhe um com menos de 40 MB.', 5); return; }
  nomeMusica.textContent = 'a carregar…';
  lerFicheiro(f).then(ab => {
    musicaDados = ab; musicaNome = f.name || 'música escolhida';
    mostrarMusica();
    BD.guardar({ nome: musicaNome, dados: ab }).catch(() => avisar('A música vai tocar, mas não ficou guardada para a próxima vez.', 5));

});

  if (v && v.dados && !comecou) { musicaDados = v.dados; musicaNome = v.nome || 'música escolhida'; mostrarMusica(); }
}).catch(() => {});

function tocar(x, y, forte) {

  Som.retomar();
  if (forte) Acordado.retomar();
  ultimoToque = t;
  proxRegresso = t + AJUSTES.esperaAntesDeVoltar;
  let fugiram = false;
  for (const c of criaturas) if (c.estado === 'nadar' || c.estado === 'entrando') { assustar(c, x, y); fugiram = true; }
  Som.pausar();
  turb = Math.min(1.2, turb + (forte ? 0.5 : 0.05));
  if (fugiram && t - ultimoZas > 0.45) { Som.zas(); ultimoZas = t; }
  if (forte) {
    ondas.push({ x, y, r: U * 1.5, a: 1 });
    for (let k = 0; k < 12; k++) { const a = rand(0, TAU), v = rand(12, 45) * U; criarBolha(x, y, rand(0.4, 1.5) * U, Math.cos(a) * v, Math.sin(a) * v - U * 8); }
    if (t - ultimoSomBolha > 0.1) { Som.bolha(0.07, 1); ultimoSomBolha = t; }
  } else if (t - ultimoRastro > 0.05) {
    ultimoRastro = t;
    criarBolha(x + rand(-1, 1) * U, y + rand(-1, 1) * U, rand(0.35, 0.9) * U, rand(-4, 4) * U, -rand(4, 10) * U);
    if (t - ultimoSomBolha > 0.3) { Som.bolha(0.035, 1.3); ultimoSomBolha = t; }
  }

        setInterval(pintar, 500);
        video.removeAttribute('src');
        video.srcObject = tela.captureStream(2);
      } else return;
      if (ligado) semErro(video.play());
    } catch (e) { if (n < 2) usarFonte(n + 1); }
  }
  function criarVideo() {
    video = document.createElement('video');
    video.className = 'acordado';
    video.title = 'Peixinhos Tímidos';
    video.setAttribute('playsinline', '');
    video.setAttribute('webkit-playsinline', '');
    video.setAttribute('aria-hidden', 'true');
    video.setAttribute('x-webkit-airplay', 'deny');
    video.playsInline = true;
    video.disableRemotePlayback = true;
    video.muted = !EH_IOS;
    video.preload = 'auto';
    video.addEventListener('timeupdate', () => { if (!video.srcObject && video.currentTime > 2) video.currentTime = 0.2 + Math.random() * 0.5; });
    video.addEventListener('ended', () => { if (ligado) { try { video.currentTime = 0; } catch (e) {} semErro(video.play()); } });
    video.addEventListener('error', () => { if (fonte < 2) usarFonte(fonte + 1); });
    video.addEventListener('pause', () => {
      if (ligado && document.visibilityState === 'visible') setTimeout(() => { if (video.paused && document.visibilityState === 'visible') semErro(video.play()); }, 1000);
    });
    document.body.appendChild(video);
    usarFonte(0);
  }
  function ligar() {            // chamado no toque de "começar"
    ligado = true;
    pedirAPI();
    if (!video) criarVideo(); else if (video.paused) semErro(video.play());
  }
  function retomar() {
    if (!ligado) return;
    pedirAPI();
    if (video && video.paused) semErro(video.play());
  }
  function suspender() { if (video && !video.paused) { try { video.pause(); } catch (e) {} } }
  return { ligar, retomar, suspender };
})();
function comecar() {
  if (comecou) return;
  Som.iniciar(musicaDados, motivo => {
    if (motivo === 'ficheiro') avisar('Não consegui ler esse ficheiro de música. Vai tocar a canção do jogo.', 5);
    else avisar('Este navegador não deixou tocar som. Experimenta abrir o link no Safari ou no Chrome.', 6);
  });
  pedirEcraInteiro();
  Acordado.ligar();
  inicio.classList.add('fora');
  comecou = true;
  const t = agoraSeg();
  graca = t + 1;
  ultimoToque = -99;
  proxRegresso = t + 0.7;
  setTimeout(() => { if (!Som.aTocarSom()) avisar('Toca no ecrã para ligar o som.', 4); }, 1800);
}
inicio.addEventListener('click', e => {
  if (e.target && e.target.closest && e.target.closest('#caixaMusica')) return;
  comecar();
});

function posicao(e) { return [e.clientX - rect.left, e.clientY - rect.top]; }
let ultX = null, ultY = null;
window.addEventListener('pointerdown', e => {
  if (!comecou) return;
  const [x, y] = posicao(e);
  ultX = x; ultY = y;
  tocar(x, y, true);
});
window.addEventListener('pointermove', e => {
  if (!comecou) return;
  const [x, y] = posicao(e);
  if (ultX === null || Math.hypot(x - ultX, y - ultY) > 3) { ultX = x; ultY = y; tocar(x, y, false); }
});
window.addEventListener('keydown', e => {
  if (!comecou) {
    const naMusica = e.target && e.target.closest && e.target.closest('#caixaMusica');
    if (!naMusica && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); comecar(); }
    return;
  }
  tocar(rand(W * 0.2, W * 0.8), rand(H * 0.2, H * 0.7), true);
});
for (const ev of ['contextmenu', 'gesturestart', 'dblclick', 'selectstart']) document.addEventListener(ev, e => e.preventDefault());
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchstart', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { Som.suspender(); Acordado.suspender(); }
  else if (comecou) { Som.retomar(); Acordado.retomar(); }
});

/* --- tamanho do ecrã --- */
function redimensionar() {
  const r = cv.getBoundingClientRect();
  const nW = Math.max(1, Math.round(r.width)), nH = Math.max(1, Math.round(r.height));
  const sx = nW / W, sy = nH / H;
  W = nW; H = nH; rect = r;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  U = Math.min(Math.min(W, H) / 100, 8.5);
  for (const c of criaturas) {
    c.S = U * 8.6 * c.esp.tam;
    if (c.estado !== 'escondido') { c.x *= sx; c.y *= sy; c.tx *= sx; c.ty *= sy; }
  }
  bolhas.length = 0; ondas.length = 0; brilhos.length = 0;
  gerarAlgas(); gerarParticulas(); gerarRaios(); construirFundo();
}
let pendente = false;
function aoRedimensionar() {
  if (pendente) return;
  pendente = true;
  requestAnimationFrame(() => { pendente = false; redimensionar(); });
}
window.addEventListener('resize', aoRedimensionar);
window.addEventListener('orientationchange', aoRedimensionar);

/* --- ciclo --- */
let anterior = 0;
function quadro(ms) {
  const t = ms / 1000;
  const dt = anterior ? clamp(t - anterior, 0, 0.05) : 0.016;
  anterior = t;
  atualizar(dt, t);
  desenhar(t);
  requestAnimationFrame(quadro);
}
redimensionar();
requestAnimationFrame(quadro);
})();
</script>
